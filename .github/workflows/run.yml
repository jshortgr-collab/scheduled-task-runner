name: Scheduled Task

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Task scope
        required: true
        default: all
        type: choice
        options:
          - all
          - a
          - b
          - publish
          - digest
      digest_slot:
        description: Automatic AM/PM delivery slot (leave blank for manual runs)
        required: false
        default: ''
        type: string
      only_due:
        description: Retry only failed or stale reports
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 0 * * *'
    - cron: '23 12 * * *'
    - cron: '37 15 1 * *'

concurrency:
  group: private-scheduled-task-v2
  cancel-in-progress: false

jobs:
  execute:
    if: (github.event_name == 'workflow_dispatch' && inputs.scope != 'publish' && inputs.scope != 'digest') || (github.event_name == 'schedule' && github.event.schedule != '37 15 1 * *')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - attempt: 1
            os: windows-latest
          - attempt: 2
            os: macos-latest
          - attempt: 3
            os: ubuntu-latest
    permissions:
      contents: read
    env:
      SERVICE_URL: ${{ secrets.SERVICE_URL }}
      SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
      EVENT_KIND: ${{ matrix.attempt == 1 && github.event_name || 'retry' }}
      TASK_SCOPE: ${{ inputs.scope || 'all' }}
      ONLY_DUE: ${{ inputs.only_due && 'true' || 'false' }}
      COLLECTION_MAX_AGE_HOURS: ${{ (inputs.digest_slot != '' || github.event_name == 'schedule') && '3' || '8' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare private task
        run: node bootstrap.cjs

      - name: Check schedule
        id: plan
        shell: bash
        working-directory: runtime
        run: echo "run=$(node scripts/cloud-runner.cjs plan)" >> "$GITHUB_OUTPUT"

      - name: Execute private task
        if: steps.plan.outputs.run == 'true'
        continue-on-error: true
        working-directory: runtime
        run: node scripts/cloud-runner.cjs execute

  verify:
    if: always() && ((github.event_name == 'workflow_dispatch' && inputs.scope != 'publish' && inputs.scope != 'digest') || (github.event_name == 'schedule' && github.event.schedule != '37 15 1 * *'))
    needs: execute
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SERVICE_URL: ${{ secrets.SERVICE_URL }}
      SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
      EVENT_KIND: retry
      TASK_SCOPE: ${{ inputs.scope || 'all' }}
      ONLY_DUE: ${{ inputs.only_due && 'true' || 'false' }}
      COLLECTION_MAX_AGE_HOURS: ${{ (inputs.digest_slot != '' || github.event_name == 'schedule') && '3' || '8' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare private task
        run: node bootstrap.cjs

      - name: Verify completion
        shell: bash
        working-directory: runtime
        run: test "$(node scripts/cloud-runner.cjs plan)" = "false"

  send-digest:
    if: always() && ((github.event_name == 'workflow_dispatch' && inputs.digest_slot != '' && (inputs.scope == 'digest' || needs.verify.result == 'success')) || (github.event_name == 'schedule' && github.event.schedule != '37 15 1 * *' && needs.verify.result == 'success'))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SERVICE_URL: ${{ secrets.SERVICE_URL }}
      SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
      REQUESTED_DIGEST_SLOT: ${{ inputs.digest_slot || '' }}
      SCHEDULE_EXPRESSION: ${{ github.event.schedule || '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare private task
        run: node bootstrap.cjs

      - name: Resolve immutable delivery slot
        id: delivery
        shell: bash
        run: |
          slot="$REQUESTED_DIGEST_SLOT"
          if [[ -z "$slot" ]]; then
            period="PM"
            if [[ "$SCHEDULE_EXPRESSION" == "23 12 * * *" ]]; then period="AM"; fi
            slot="$(TZ=America/New_York date +%F)-$period"
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      - name: Send one verified fresh digest
        working-directory: runtime
        shell: bash
        run: |
          node scripts/cloud-state.cjs pull
          node scripts/cloud-state.cjs publish-digest books christian-books-bibles --slot="${{ steps.delivery.outputs.slot }}" --max-age-hours=3

  publish-dashboard:
    if: always() && ((github.event_name == 'workflow_dispatch' && inputs.scope == 'publish') || (needs.verify.result == 'success' && (github.event_name == 'workflow_dispatch' || github.event.schedule != '37 15 1 * *')))
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SERVICE_URL: ${{ secrets.SERVICE_URL }}
      SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}

    steps:
      - name: Check private-beta publishing
        id: publishing
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_PAGES_PROJECT" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Private-beta publishing is not configured yet."
          fi

      - uses: actions/checkout@v5
        if: steps.publishing.outputs.enabled == 'true'

      - uses: actions/setup-node@v5
        if: steps.publishing.outputs.enabled == 'true'
        with:
          node-version: '22'

      - name: Prepare private dashboard
        if: steps.publishing.outputs.enabled == 'true'
        run: node bootstrap.cjs

      - name: Build sanitized dashboard
        if: steps.publishing.outputs.enabled == 'true'
        working-directory: runtime
        run: |
          node scripts/cloud-state.cjs pull
          node scripts/public-export.cjs
          node scripts/check-public-export.cjs

      - name: Publish private-beta dashboard
        if: steps.publishing.outputs.enabled == 'true'
        working-directory: runtime
        shell: bash
        run: npx --yes wrangler@4 pages deploy public-site --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main

  heartbeat:
    if: github.event_name == 'schedule' && github.event.schedule == '37 15 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Record activity
        shell: bash
        run: |
          git config user.name "scheduled-task"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$(date -u +%Y-%m)" > .heartbeat
          git add .heartbeat
          git diff --cached --quiet || git commit -m "maintain schedule"
          git push
