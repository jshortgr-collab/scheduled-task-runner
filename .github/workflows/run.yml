name: Scheduled Task

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Task scope
        required: true
        default: all
        type: choice
        options:
          - all
          - a
          - b
          - publish
          - digest
      digest_slot:
        description: Automatic AM/PM delivery slot (leave blank for manual runs)
        required: false
        default: ''
        type: string
      only_due:
        description: Retry only failed or stale reports
        required: false
        default: false
        type: boolean
  schedule:
    # Primary checks stay within one hour of 5 AM / 3 PM Eastern across DST.
    - cron: '5 10 * * *'
    - cron: '5 20 * * *'
    # Spaced catch-ups are the only scheduled runs that send or alert red.
    - cron: '23 13 * * *'
    - cron: '23 23 * * *'
    - cron: '37 15 1 * *'

concurrency:
  group: private-scheduled-task-v3
  cancel-in-progress: false

jobs:
  execute:
    if: (github.event_name == 'workflow_dispatch' && inputs.scope != 'publish' && inputs.scope != 'digest') || (github.event_name == 'schedule' && github.event.schedule != '37 15 1 * *')
    runs-on: ${{ ((github.event_name == 'schedule' && (github.event.schedule == '23 13 * * *' || github.event.schedule == '23 23 * * *')) || inputs.only_due) && 'macos-latest' || 'windows-latest' }}
    timeout-minutes: 110
    permissions:
      contents: read
    env:
      SERVICE_URL: ${{ secrets.SERVICE_URL }}
      SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
      EVENT_KIND: ${{ github.event_name }}
      TASK_SCOPE: ${{ inputs.scope || 'all' }}
      ONLY_DUE: ${{ (inputs.only_due || github.event.schedule == '23 13 * * *' || github.event.schedule == '23 23 * * *') && 'true' || 'false' }}
      PROVISIONAL_FAILURE: ${{ (github.event_name == 'schedule' && (github.event.schedule == '5 10 * * *' || github.event.schedule == '5 20 * * *')) && 'true' || 'false' }}
      COLLECTION_MAX_AGE_HOURS: ${{ (inputs.digest_slot != '' || github.event_name == 'schedule') && '3' || '8' }}

    steps:
      - uses: actions/checkout@v5
        id: checkout
        continue-on-error: true

      - uses: actions/setup-node@v5
        id: node
        continue-on-error: true
        with:
          node-version: '22'

      - name: Prepare private task
        id: prepare
        continue-on-error: true
        run: node bootstrap.cjs

      - name: Check schedule
        id: plan
        continue-on-error: true
        shell: bash
        working-directory: runtime
        run: echo "run=$(node scripts/cloud-runner.cjs plan)" >> "$GITHUB_OUTPUT"

      - name: Execute private task
        id: execute
        if: steps.plan.outputs.run == 'true'
        continue-on-error: true
        working-directory: runtime
        run: node scripts/cloud-runner.cjs execute

      - name: Record primary recovery notice
        if: always() && github.event_name == 'schedule' && (github.event.schedule == '5 10 * * *' || github.event.schedule == '5 20 * * *') && (steps.checkout.outcome == 'failure' || steps.node.outcome == 'failure' || steps.prepare.outcome == 'failure' || steps.plan.outcome == 'failure' || steps.execute.outcome == 'failure')
        shell: bash
        run: echo "::warning::The primary collection did not complete; the spaced catch-up will retry automatically."

  finalize:
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (github.event.schedule == '23 13 * * *' || github.event.schedule == '23 23 * * *')))
    needs: execute
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SERVICE_URL: ${{ secrets.SERVICE_URL }}
      SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
      EVENT_KIND: retry
      TASK_SCOPE: ${{ inputs.scope || 'all' }}
      ONLY_DUE: 'true'
      PROVISIONAL_FAILURE: 'false'
      COLLECTION_MAX_AGE_HOURS: ${{ (inputs.digest_slot != '' || github.event_name == 'schedule') && '3' || '8' }}
      REQUESTED_DIGEST_SLOT: ${{ inputs.digest_slot || '' }}
      SCHEDULE_EXPRESSION: ${{ github.event.schedule || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare private task
        run: node bootstrap.cjs

      - name: Verify final completion
        id: verify
        if: inputs.scope != 'publish' && inputs.scope != 'digest'
        shell: bash
        working-directory: runtime
        run: |
          if [[ "$(node scripts/cloud-runner.cjs plan)" != "false" ]]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "::error::The final catch-up could not complete every fresh report."
            exit 1
          fi
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable delivery slot
        id: delivery
        if: (github.event_name == 'schedule' && steps.verify.outputs.complete == 'true') || (github.event_name == 'workflow_dispatch' && inputs.digest_slot != '' && (inputs.scope == 'digest' || steps.verify.outputs.complete == 'true'))
        shell: bash
        run: |
          slot="$REQUESTED_DIGEST_SLOT"
          if [[ -z "$slot" ]]; then
            period="PM"
            if [[ "$SCHEDULE_EXPRESSION" == "23 13 * * *" ]]; then period="AM"; fi
            slot="$(TZ=America/New_York date +%F)-$period"
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      - name: Send one verified fresh digest
        id: digest
        if: steps.delivery.outputs.slot != ''
        working-directory: runtime
        shell: bash
        run: |
          node scripts/cloud-state.cjs pull
          node scripts/cloud-state.cjs publish-digest books christian-books-bibles --slot="${{ steps.delivery.outputs.slot }}" --max-age-hours=3

      - name: Check private-beta publishing
        id: publishing
        if: inputs.scope == 'publish' || (inputs.scope != 'digest' && steps.verify.outputs.complete == 'true')
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_PAGES_PROJECT" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Private-beta dashboard publishing is not configured."
          fi

      - name: Build sanitized dashboard
        if: steps.publishing.outputs.enabled == 'true'
        working-directory: runtime
        run: |
          node scripts/cloud-state.cjs pull
          node scripts/public-export.cjs
          node scripts/check-public-export.cjs

      - name: Publish private-beta dashboard
        if: steps.publishing.outputs.enabled == 'true'
        working-directory: runtime
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npx --yes wrangler@4 pages deploy public-site --project-name="$CLOUDFLARE_PAGES_PROJECT" --branch=main; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then sleep $((attempt * 20)); fi
          done
          exit 1

  heartbeat:
    if: github.event_name == 'schedule' && github.event.schedule == '37 15 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Record activity
        shell: bash
        run: |
          git config user.name "scheduled-task"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$(date -u +%Y-%m)" > .heartbeat
          git add .heartbeat
          git diff --cached --quiet || git commit -m "maintain schedule"
          git push
